spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orders_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: fer
    password: fer123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
google:
  gemini:
    api:
      key: ${GOOGLE_GEMINI_API_KEY}
      model: gemini-2.5-flash
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true