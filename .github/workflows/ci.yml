name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Bước 1: Chạy Test trước. Nếu test tạch, pipeline sẽ dừng luôn, không tốn tài nguyên build Docker bậy bạ.
      - name: Run Unit Tests
        working-directory: back-end
        run: mvn test

      # Bước 2: Build file JAR
      - name: Build with Maven
        working-directory: back-end
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        # Chỉ login khi là branch main và test đã pass
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/order-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/order-management:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/order-management:${{ github.sha }}